<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez Sahraoui - Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 20px; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 350px; }
    .login-box h1 { text-align: center; color: #1e3c72; margin-bottom: 20px; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
    .btn { width: 100%; padding: 12px; background: #2a5298; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: 600; }
    .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 15px; text-align: center; }
    .container { padding: 15px; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .budget-card { padding: 20px; text-align: center; border-left: 5px solid; }
    .budget-card.green { border-left-color: #10b981; }
    .budget-card.yellow { border-left-color: #f59e0b; }
    .budget-card.red { border-left-color: #ef4444; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-item { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; color: #333; }
    .stat-label { font-size: 12px; color: #666; }
    .notification { padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid; }
    .notification.urgent { border-left-color: #ef4444; background: #fef2f2; }
    .cheque-item { padding: 12px; margin: 8px 0; background: #f8f9fa; border-radius: 8px; border-left: 3px solid #2a5298; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }
    .badge.en_attente { background: #fef3c7; color: #d97706; }
    .badge.paye { background: #d1fae5; color: #059669; }
    .badge.impaye { background: #fee2e2; color: #dc2626; }
    .btn-action { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; margin: 2px; }
    .btn-edit { background: #10b981; color: white; }
    .btn-delete { background: #ef4444; color: white; }
    .user-info { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 5px; margin-bottom: 10px; font-size: 14px; }
    .hidden { display: none !important; }
    .date-real { font-size: 11px; color: #10b981; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-container" id="loginContainer">
    <div class="login-box">
      <h1>🔐 Chez Sahraoui</h1>
      <form id="loginForm">
        <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
        <button type="submit" class="btn">Se connecter</button>
      </form>
      <div style="margin-top:15px; padding-top:12px; border-top:1px solid #eee; font-size:12px;">
        <p style="color:#666; margin-bottom:8px; font-weight:600;">Accès rapide :</p>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button type="button" onclick="fillLogin('gerant3', 'hiba1122.33')" style="padding:6px; border:1px solid #ddd; background:#e0f2fe; border-radius:4px; font-size:11px; text-align:left; cursor:pointer;">👑 <strong>Hiba (Admin)</strong></button>
          <button type="button" onclick="fillLogin('gerant1', 'brahim1122.33')" style="padding:6px; border:1px solid #ddd; background:#f3e8ff; border-radius:4px; font-size:11px; text-align:left; cursor:pointer;">💼 <strong>Brahim (Gérant)</strong></button>
          <button type="button" onclick="fillLogin('gerant2', 'anas1122.33')" style="padding:6px; border:1px solid #ddd; background:#f3e8ff; border-radius:4px; font-size:11px; text-align:left; cursor:pointer;">💼 <strong>Anas (Gérant)</strong></button>
        </div>
      </div>
      <div style="text-align:center; margin-top:12px;">
        <a href="/" style="color:#2a5298; font-size:12px; text-decoration:none;">🖥️ Version Bureau (Desktop)</a>
      </div>
    </div>
  </div>

  <div id="appContainer" class="hidden">
    <div class="header">
      <div class="user-info" id="userInfo">Gérant</div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>🔔 Chez Sahraoui</h2>
        <div>
          <a href="/" style="color:#64ffda; font-size:12px; margin-right:10px; text-decoration:none;">🖥️ Bureau</a>
          <a onclick="logoutMobile()" style="color:#ffb4b4; font-size:12px; cursor:pointer;">🚪 Quitter</a>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="card budget-card" id="budgetCard">
        <h3>Budget du Mois</h3>
        <div style="font-size: 28px; font-weight: bold; margin: 10px 0;" id="budgetValue">Chargement...</div>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 10px;"> Statistiques</h3>
        <div class="stat-grid">
          <div class="stat-item"><div class="stat-value" id="totalCheques">0</div><div class="stat-label">Total Chèques</div></div>
          <div class="stat-item"><div class="stat-value" id="enAttente">0</div><div class="stat-label">En Attente</div></div>
        </div>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 15px;">🔔 Notifications</h3>
        <div id="notifications"></div>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 15px;">📋 Chèques Récents</h3>
        <div id="cheques"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    const originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      const token = localStorage.getItem('cs_token');
      const opts = { ...options };
      opts.credentials = 'include';
      if (token) {
        opts.headers = {
          ...(opts.headers || {}),
          'Authorization': 'Bearer ' + token
        };
      }
      return originalFetch(url, opts);
    };

    function fillLogin(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true }));
    }

    let currentUser = null;
    let userRole = null;

    function initMobileUI(user) {
      currentUser = user;
      userRole = user.role;
      document.getElementById('loginContainer').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('userInfo').textContent = `${currentUser.name} (${userRole === 'admin' ? 'Admin' : 'Gérant'})`;
      loadData();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch(`${API_URL}/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        if (data.token) {
          localStorage.setItem('cs_token', data.token);
        }
        initMobileUI(data.user);
      } else alert(data.message);
    });

    async function logoutMobile() {
      await fetch(`${API_URL}/logout`, { method: 'POST' });
      localStorage.removeItem('cs_token');
      location.reload();
    }

    async function checkMobileAuth() {
      try {
        const res = await fetch(`${API_URL}/me`);
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.user) {
            initMobileUI(data.user);
          }
        }
      } catch (err) {}
    }
    checkMobileAuth();

    async function loadData() {
      const now = new Date();
      const budgetRes = await fetch(`${API_URL}/budget/${now.getMonth()+1}/${now.getFullYear()}`);
      const budget = await budgetRes.json();
      const budgetCard = document.getElementById('budgetCard');
      budgetCard.className = `card budget-card ${budget.status}`;
      document.getElementById('budgetValue').innerHTML = `${budget.spent.toFixed(0)} / ${budget.maxAmount.toFixed(0)} DH<br><small>${budget.percentage.toFixed(1)}%</small>`;
      
      const notifRes = await fetch(`${API_URL}/notifications`);
      const notifications = await notifRes.json();
      document.getElementById('notifications').innerHTML = notifications.slice(0, 10).map(n => `
        <div class="notification ${n.type} ${n.urgent ? 'urgent' : ''}">
          <strong>${n.message}</strong><br><small>${new Date(n.date).toLocaleString('fr-FR')}</small>
        </div>
      `).join('') || '<p style="color:#999;text-align:center">Aucune notification</p>';
      
      const chequesRes = await fetch(`${API_URL}/cheques`);
      const cheques = await chequesRes.json();
      document.getElementById('cheques').innerHTML = cheques.slice(0, 10).map(c => `
        <div class="cheque-item">
          <strong>#${c.numero}</strong> - ${c.fournisseur ? c.fournisseur.nom : '-'}<br>
          ${c.montant.toFixed(2)} DH<br>
          <small>Échéance: ${new Date(c.datePaiement).toLocaleDateString('fr-FR')}</small><br>
          ${c.datePaiementReel ? `<span class="date-real">✅ Payé le: ${new Date(c.datePaiementReel).toLocaleDateString('fr-FR')}</span><br>` : ''}
          <small>Bon: ${c.bonLivraison || '-'}</small><br>
          <span class="badge ${c.statut}">${c.statut}</span>
          ${userRole === 'admin' ? `
            <div style="margin-top:8px;">
              <button class="btn-action btn-edit" onclick="updateStatut(${c.id}, 'paye')">✅ Payé</button>
              <button class="btn-action btn-delete" onclick="updateStatut(${c.id}, 'impaye')">❌ Impayé</button>
              <button class="btn-action btn-delete" onclick="deleteChequeMobile(${c.id})" style="background:#dc2626">🗑️</button>
            </div>
          ` : ''}
        </div>
      `).join('') || '<p style="color:#999;text-align:center">Aucun chèque</p>';
      
      const statsRes = await fetch(`${API_URL}/rapport`);
      const stats = await statsRes.json();
      document.getElementById('totalCheques').textContent = stats.nbCheques;
      document.getElementById('enAttente').textContent = cheques.filter(c => c.statut === 'en_attente').length;
    }

    async function updateStatut(id, statut) {
      const confirmMsg = statut === 'paye' 
        ? 'Confirmer le paiement? Date du jour sera enregistrée.' 
        : 'Confirmer IMPAYÉ?';
      if (!confirm(confirmMsg)) return;
      const res = await fetch(`${API_URL}/cheques/${id}/statut`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut })
      });
      const result = await res.json();
      if (result.success) { 
        alert(statut === 'paye' ? `✅ Payé le ${new Date().toLocaleDateString('fr-FR')}` : '❌ Impayé'); 
        loadData(); 
      }
      else alert('❌ ' + result.error);
    }

    async function deleteChequeMobile(id) {
      if (!confirm('Supprimer ce chèque?')) return;
      const res = await fetch(`${API_URL}/cheques/${id}`, { method: 'DELETE' });
      const result = await res.json();
      if (result.success) { alert('🗑️ Supprimé'); loadData(); }
      else alert(' ' + result.error);
    }

    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
